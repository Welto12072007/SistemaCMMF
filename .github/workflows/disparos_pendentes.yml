name: Disparos Pendentes

on:
  schedule:
    # A cada 15 minutos (GitHub Actions usa UTC) — processa os tipos em TIPOS_PERMITIDOS (disparos_pendentes.py)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script
        run: python scripts/disparos_pendentes.py
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          EVOLUTION_API_URL:     ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:     ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE:    ${{ secrets.EVOLUTION_INSTANCE }}
