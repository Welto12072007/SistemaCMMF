name: Automações Agendadas

on:
  # schedule:
  #   # A cada hora UTC — cobre todos os horários BRT (UTC-3):
  #   # ex: 09h BRT=12h UTC, 11h BRT=14h UTC, 15h BRT=18h UTC, 18h BRT=21h UTC
  #   # (*/2 não cobria 21h UTC = 18h BRT necessário para lembretes amanhã)
  #   - cron: "0 * * * *"
  workflow_dispatch:
    # Permite rodar manualmente pela aba Actions do GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script
        run: python scripts/automacoes.py
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          EVOLUTION_API_URL:     ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:     ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE:    ${{ secrets.EVOLUTION_INSTANCE }}
          CHEFE_TEL:             ${{ secrets.CHEFE_TEL }}
